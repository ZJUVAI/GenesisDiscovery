[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-discovery"
version = "0.1.0"
description = "Discover algebraic relations and integer relations among constants."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "mpmath>=1.2",
    "sympy>=1.10",
    "numpy>=1.21",
    "scipy>=1.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
generator = ["torch>=2.0", "transformers>=4.30,<5", "peft>=0.4"]

[project.scripts]
rde = "rde.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# The CLI currently loads its benchmark relations from tests.known_results.
include = ["rde", "rde.*", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rde"]
